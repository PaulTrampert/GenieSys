name: CMake

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      # Without this, one platform failing cancels the other mid-build and
      # hides whether it would have passed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v2
      id: cpu-cores

    - name: get-cmake
      # You may pin to the exact commit or the version.
      # uses: lukka/get-cmake@573c9a901acfd6b42c7a6f68d657326ef3d72a78
      uses: lukka/get-cmake@latest
      with:
        # Must stay new enough to know the generator for the Visual Studio on
        # the windows runner. windows-latest moved to VS 2026, which CMake
        # 3.31 has no generator for, so configure fell back to NMake Makefiles
        # and failed with "CMAKE_CXX_COMPILER not set". The project itself only
        # needs 3.31.6 (see CMakeLists.txt).
        cmakeVersion: latest

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{runner.workspace}}/build
      # Note the current convention is to use the -S and -B options here to specify source 
      # and build directories, but this is only available with CMake 3.13 and higher.  
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE -j${{ steps.cpu-cores.outputs.cores }}

    - name: Test
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C $BUILD_TYPE

    - name: Collect test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ runner.os }}
        path: ${{runner.workspace}}/**/*.log
